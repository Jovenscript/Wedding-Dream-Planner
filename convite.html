<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=3" />
<title>Convite de Casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#6B7B4A; --olive-dark:#3D4A28; --olive-deep:#2A3419;
  --gold:#C9A84C; --gold-lt:#EBD79C; --gold-bright:#E4C468;
  --ivory:#FAF6ED; --ivory-2:#F3ECDC; --cream:#FFFDF8;
  --ink:#33321F; --ink-soft:#6E6B52;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; overflow-x:hidden; }
body{ font-family:'Inter',sans-serif; color:var(--ink); background:#1a1f12; -webkit-font-smoothing:antialiased; }
.serif{ font-family:'Cormorant Garamond',serif; }

/* ══════════════ FUNDO CINEMATOGRÁFICO COM PROFUNDIDADE ══════════════ */
#bg-scene{ position:fixed; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(140% 100% at 50% -10%, #4a5535 0%, #333c22 35%, #232a16 70%, #1a1f12 100%); }
/* névoa dourada em camadas (parallax) */
.glow{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.5; will-change:transform; }
.glow-1{ width:60vw; height:60vw; top:-10%; left:-10%; background:radial-gradient(circle, rgba(201,168,76,.5), transparent 70%); }
.glow-2{ width:50vw; height:50vw; bottom:-15%; right:-10%; background:radial-gradient(circle, rgba(107,123,74,.6), transparent 70%); }
.glow-3{ width:40vw; height:40vw; top:40%; left:50%; background:radial-gradient(circle, rgba(235,215,156,.35), transparent 70%); }
/* partículas douradas flutuantes */
.particles{ position:absolute; inset:0; }
.pt{ position:absolute; width:4px; height:4px; border-radius:50%; background:var(--gold-lt);
  box-shadow:0 0 8px 2px rgba(235,215,156,.6); opacity:0; animation:float linear infinite; }
@keyframes float{ 0%{ transform:translateY(20px) scale(0); opacity:0; } 10%{ opacity:.9; }
  90%{ opacity:.9; } 100%{ transform:translateY(-110vh) scale(1); opacity:0; } }

/* ══════════════ CENA DE ABERTURA — envelope físico em camadas ══════════════ */
#stage{ position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 24px; perspective:1400px; perspective-origin:50% 40%;
  transition:opacity 1s cubic-bezier(.4,0,.2,1), visibility 1s;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(107,123,74,.15) 0%, transparent 60%),
    radial-gradient(circle at 50% 50%, #2a3419 0%, #1a1f12 60%, #10160a 100%); }
#stage.gone{ opacity:0; visibility:hidden; pointer-events:none; }

/* Estados da máquina — cada estado ativa animações diferentes */
#stage[data-state="closed"] .envelope{ animation:envFloat 6s ease-in-out infinite; }
#stage[data-state="opening_seal"] .seal{ animation:sealBreak .5s cubic-bezier(.22,1,.36,1) forwards; }
#stage[data-state="opening_flap"] .seal{ opacity:0; transform:translate(-50%,-50%) scale(.5) translateZ(20px); }
#stage[data-state="opening_flap"] .flap{ animation:flapOpen .85s cubic-bezier(.5,.05,.3,.98) forwards; }
#stage[data-state="revealing_card"] .seal{ opacity:0; }
#stage[data-state="revealing_card"] .flap{ transform:rotateX(-170deg); }
#stage[data-state="revealing_card"] .card-slot{ animation:cardRise 1s cubic-bezier(.22,1,.36,1) forwards; }
#stage[data-state="card_revealed"] .seal{ opacity:0; }
#stage[data-state="card_revealed"] .flap{ transform:rotateX(-170deg); }
#stage[data-state="card_revealed"] .card-slot{ transform:translateY(-70%) scale(1); box-shadow:0 24px 40px rgba(0,0,0,.5); }
#stage[data-state="entering"] .seal{ opacity:0; }
#stage[data-state="entering"] .flap{ transform:rotateX(-170deg); }
#stage[data-state="entering"] .card-slot{ animation:cardEnter 1.1s cubic-bezier(.16,1,.3,1) forwards; }
#stage[data-state="entering"] .envelope-body{ animation:envelopeFade .8s ease-out forwards; }
#stage[data-state="entering"] .env-hint{ opacity:0; }

/* Envelope: composição em camadas com profundidade */
.env-scene{ text-align:center; transform-style:preserve-3d; }
.envelope{ position:relative; width:min(360px, 82vw); aspect-ratio: 3 / 2;
  transform-style:preserve-3d; transform:rotateX(4deg);
  cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
.envelope.locked{ cursor:default; }

@keyframes envFloat{ 0%,100%{ transform:rotateX(4deg) translateY(0); } 50%{ transform:rotateX(4deg) translateY(-8px); } }

/* Sombra projetada no chão */
.env-shadow{ position:absolute; left:8%; right:8%; bottom:-14px; height:26px; z-index:0;
  background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  filter:blur(10px); transform:scaleY(.6); }

/* Corpo do envelope agrupado — some suavemente quando entra no convite */
.envelope-body{ position:absolute; inset:0; transform-style:preserve-3d; }
@keyframes envelopeFade{ to{ opacity:0; transform:scale(1.15); } }

/* CAMADA 1: fundo/traseira do envelope */
.env-back{ position:absolute; inset:0; border-radius:6px;
  background:linear-gradient(160deg, #efe5cf 0%, #e0d3b6 55%, #d3c4a3 100%);
  box-shadow:0 30px 60px rgba(0,0,0,.5), 0 12px 24px rgba(0,0,0,.35);
  border:1px solid rgba(154,131,84,.35); }
/* textura sutil de papel */
.env-back::before{ content:''; position:absolute; inset:0; border-radius:6px;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.06) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,0,0,.04) 0%, transparent 40%);
  mix-blend-mode:overlay; }

/* CAMADA 2: interior do envelope (revelado quando aba abre) */
.env-inner{ position:absolute; left:2%; right:2%; top:8%; bottom:35%; border-radius:3px;
  background:linear-gradient(180deg, #2a2517 0%, #3a3220 40%, #4a3f28 100%);
  box-shadow:inset 0 4px 12px rgba(0,0,0,.6), inset 0 -2px 6px rgba(255,255,255,.05); }

/* CAMADA 3: o cartão que sobe (posicionado ATRÁS da frente do envelope) */
.card-slot{ position:absolute; left:8%; right:8%; top:26%; bottom:10%; z-index:2;
  transform:translateY(6%) scale(.94); transform-origin:50% 100%;
  will-change:transform; }
.card{ width:100%; height:100%; border-radius:6px; position:relative; overflow:hidden;
  background:linear-gradient(160deg, #fffdf5 0%, #f7f0dd 100%);
  box-shadow:0 6px 14px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.2);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:14px 18px; text-align:center; }
.card::before{ content:''; position:absolute; inset:0;
  background:linear-gradient(160deg, rgba(201,168,76,.08), transparent 50%); }
.card-monogram{ font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--gold-dark, #a9832f); font-weight:700; letter-spacing:.15em; margin-bottom:4px; }
.card-title{ font-family:'Cormorant Garamond',serif; font-size:15px; color:var(--olive-dark, #3D4A28); font-weight:500; letter-spacing:.25em; text-transform:uppercase; }
.card-couple{ font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--olive-dark, #3D4A28); font-weight:600; margin-top:6px; }
.card-amp{ color:var(--gold, #C9A84C); font-style:italic; }
.card-ornament{ width:30px; height:1px; background:var(--gold, #C9A84C); margin:8px auto; }

@keyframes cardRise{
  0%   { transform:translateY(6%) scale(.94) rotate(-.4deg); }
  30%  { transform:translateY(-20%) scale(.97) rotate(.3deg); }
  70%  { transform:translateY(-55%) scale(.99) rotate(-.2deg); }
  100% { transform:translateY(-70%) scale(1) rotate(0deg); }
}
@keyframes cardEnter{
  0%   { transform:translateY(-70%) scale(1); opacity:1; }
  60%  { transform:translateY(-40%) scale(1.6); opacity:.9; }
  100% { transform:translateY(-10%) scale(2.6); opacity:0; }
}

/* CAMADA 4: bolso frontal do envelope (esconde o cartão inicialmente) */
.env-front{ position:absolute; left:0; right:0; bottom:0; height:60%; z-index:3;
  background:linear-gradient(160deg, #e6d9bc 0%, #d5c6a4 100%);
  clip-path:polygon(0 100%, 0 22%, 50% 96%, 100% 22%, 100% 100%);
  border-radius:0 0 6px 6px;
  box-shadow:inset 0 3px 8px rgba(255,255,255,.25);
  border-bottom:1px solid rgba(154,131,84,.4);
  border-left:1px solid rgba(154,131,84,.3);
  border-right:1px solid rgba(154,131,84,.3); }
/* linhas de vinco laterais para dar aparência física */
.env-front::before{ content:''; position:absolute; inset:0;
  background:
    linear-gradient(105deg, transparent 42%, rgba(255,255,255,.18) 50%, transparent 58%),
    linear-gradient(to bottom right, rgba(0,0,0,.08), transparent 40%),
    linear-gradient(to bottom left, rgba(0,0,0,.08), transparent 40%); }

/* CAMADA 5: aba superior (a que rotaciona) */
.flap{ position:absolute; left:0; right:0; top:0; height:58%; z-index:5;
  transform-origin:top center; transform:rotateX(0deg); transform-style:preserve-3d;
  will-change:transform; pointer-events:none; }
.flap-face{ position:absolute; inset:0; backface-visibility:hidden;
  background:linear-gradient(160deg, #ecdec2 0%, #dbcba7 100%);
  clip-path:polygon(0 0, 100% 0, 50% 96%);
  box-shadow:0 3px 8px rgba(0,0,0,.15); }
.flap-face::after{ content:''; position:absolute; inset:0; clip-path:polygon(0 0, 100% 0, 50% 96%);
  background:linear-gradient(160deg, rgba(255,255,255,.28) 0%, transparent 60%); }
/* Face traseira da aba (fica visível quando abre) */
.flap-back{ position:absolute; inset:0; backface-visibility:hidden;
  transform:rotateX(180deg);
  background:linear-gradient(180deg, #3a3220 0%, #4a3f28 100%);
  clip-path:polygon(0 0, 100% 0, 50% 96%);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.4); }
@keyframes flapOpen{
  0%   { transform:rotateX(0deg); }
  100% { transform:rotateX(-170deg); }
}

/* CAMADA 6: selo/lacre */
.seal{ position:absolute; left:50%; top:44%; transform:translate(-50%,-50%) translateZ(4px); z-index:6;
  width:58px; height:58px; border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #e6c86e, #c9a84c 45%, #8a6b23 90%);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(120,90,30,.55), inset 0 2px 3px rgba(255,255,255,.5), inset 0 -2px 5px rgba(0,0,0,.3);
  transition:opacity .4s ease; will-change:transform, opacity; }
.seal::before{ content:''; position:absolute; inset:5px; border:1px solid rgba(255,248,220,.5); border-radius:50%; pointer-events:none; }
.seal-text{ font-family:'Cormorant Garamond',serif; color:#fff8dc; font-size:20px; font-weight:700;
  letter-spacing:.05em; text-shadow:0 1px 2px rgba(0,0,0,.35); }
@keyframes sealBreak{
  0%   { transform:translate(-50%,-50%) rotate(0deg) scale(1) translateZ(4px); }
  40%  { transform:translate(-50%, -55%) rotate(-8deg) scale(1.05) translateZ(4px); }
  100% { transform:translate(-50%, -80%) rotate(-25deg) scale(.7) translateZ(4px); opacity:0; }
}

/* Micro-resposta ao toque */
.envelope.tap-pulse{ animation:tapPulse .18s ease-out; }
@keyframes tapPulse{
  0%   { transform:rotateX(4deg) scale(1); }
  50%  { transform:rotateX(4deg) scale(1.015); }
  100% { transform:rotateX(4deg) scale(1); }
}

/* Texto de instrução */
.env-hint{ margin-top:38px; font-size:11px; letter-spacing:.4em; color:rgba(240,220,160,.7);
  text-transform:uppercase; font-weight:500; opacity:0;
  animation:hintIn 1.2s ease 1.2s forwards; transition:opacity .4s ease; }
#stage[data-state="closed"] .env-hint .arrow{ display:inline-block; margin-left:8px; animation:arrowBob 1.8s ease-in-out infinite; }
#stage:not([data-state="closed"]) .env-hint{ opacity:0; transition:opacity .3s ease; }
@keyframes hintIn{ to{ opacity:1; } }
@keyframes arrowBob{ 0%,100%{ transform:translateY(0); opacity:.7; } 50%{ transform:translateY(4px); opacity:1; } }

/* Reduced motion: mantém sequência, mas mais rápido e sem 3D exagerado */
@media (prefers-reduced-motion: reduce){
  #stage[data-state="closed"] .envelope{ animation:none; }
  @keyframes flapOpen{ 0%{transform:rotateX(0)} 100%{transform:rotateX(-170deg)} }
  @keyframes cardRise{ 100%{transform:translateY(-58%) scale(1)} }
}
/* ══════════════ CONVITE (conteúdo) ══════════════ */
#invite{ position:relative; z-index:10; opacity:0; transition:opacity 1s ease .3s; }
#invite.show{ opacity:1; }

.hero{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:60px 26px; position:relative; }
.hero-inner{ transform-style:preserve-3d; }
.hero-badge{ width:96px; height:96px; margin:0 auto 30px; position:relative; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 40% 35%, rgba(235,215,156,.25), rgba(201,168,76,.08));
  border:1px solid rgba(235,215,156,.4);
  box-shadow:0 8px 30px rgba(0,0,0,.3), inset 0 0 20px rgba(235,215,156,.15); }
.hero-badge span{ font-family:'Cormorant Garamond',serif; font-size:40px; color:var(--gold-lt); font-weight:500; }
.hero-badge img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
.hero .eyebrow{ font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(235,215,156,.8); margin-bottom:20px; }
.hero .couple{ font-size:clamp(44px,14vw,84px); line-height:1; color:#fff; font-weight:500;
  text-shadow:0 4px 30px rgba(0,0,0,.4); letter-spacing:.01em; }
.hero .amp{ display:block; font-size:.42em; color:var(--gold-lt); font-style:italic; margin:10px 0; font-weight:300; }
.hero .tagline{ font-size:clamp(16px,4.5vw,20px); color:rgba(250,246,237,.85); margin-top:26px; max-width:32ch;
  font-style:italic; font-weight:300; line-height:1.6; font-family:'Cormorant Garamond',serif; }
.scroll-cue{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px; color:rgba(235,215,156,.7); font-size:11px; letter-spacing:.2em; }
.scroll-cue .chev{ font-size:20px; animation:tapBounce 1.8s ease-in-out infinite; }

/* seções em vidro (glassmorphism) */
.section{ padding:60px 24px; max-width:600px; margin:0 auto; position:relative; }
.glass-card{ background:rgba(250,246,237,.08); backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3); border:1px solid rgba(235,215,156,.22);
  border-radius:24px; padding:34px 28px; box-shadow:0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1); }
.reveal{ opacity:0; transform:translateY(40px); transition:opacity .9s ease, transform .9s cubic-bezier(.2,.8,.3,1); }
.reveal.in{ opacity:1; transform:none; }

.divider{ display:flex; align-items:center; justify-content:center; gap:14px; margin:0 auto 34px; }
.divider .line{ width:44px; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
.divider .line.r{ background:linear-gradient(90deg, var(--gold), transparent); }
.divider .dot{ color:var(--gold-lt); font-size:14px; }

.info-list{ display:flex; flex-direction:column; gap:2px; }
.info-row{ display:flex; align-items:center; gap:18px; padding:18px 6px; border-bottom:1px solid rgba(235,215,156,.14); }
.info-row:last-child{ border-bottom:none; }
.info-row .ir-ico{ width:44px; height:44px; flex:0 0 auto; border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  background:rgba(235,215,156,.12); border:1px solid rgba(235,215,156,.2); }
.info-row .ir-label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(235,215,156,.7); }
.info-row .ir-value{ font-family:'Cormorant Garamond',serif; font-size:24px; color:#fff; font-weight:500; line-height:1.15; margin-top:2px; }

.btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  padding:17px 22px; border-radius:15px; font-size:15px; font-weight:600; border:none; cursor:pointer;
  transition:transform .18s cubic-bezier(.3,.9,.3,1.2), box-shadow .25s ease; text-decoration:none;
  margin-top:14px; letter-spacing:.01em; position:relative; overflow:hidden; }
.btn::after{ content:''; position:absolute; inset:0; background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.25) 50%, transparent 65%); transform:translateX(-120%); transition:transform .6s; }
.btn:hover::after{ transform:translateX(120%); }
.btn:active{ transform:scale(.96); }
.btn-gold{ background:linear-gradient(135deg, var(--gold-bright), var(--gold)); color:#3a2c08;
  box-shadow:0 10px 30px rgba(201,168,76,.4), inset 0 1px 0 rgba(255,255,255,.4); }
.btn-glass{ background:rgba(250,246,237,.1); backdrop-filter:blur(10px); color:#fff;
  border:1px solid rgba(235,215,156,.35); }

/* RSVP */
.rsvp h2{ font-family:'Cormorant Garamond',serif; font-size:clamp(32px,9vw,44px); color:#fff; text-align:center; margin-bottom:8px; font-weight:500; }
.rsvp .fam{ text-align:center; color:rgba(235,215,156,.85); font-size:15px; margin-bottom:4px; }
.rsvp .names{ text-align:center; color:rgba(250,246,237,.7); font-size:14px; margin-bottom:30px; font-style:italic; font-family:'Cormorant Garamond',serif; }
.rsvp-btns{ display:flex; flex-direction:column; gap:12px; }
.rsvp-done{ text-align:center; padding:20px 8px; }
.rsvp-done .big{ font-size:60px; margin-bottom:16px; animation:pop .6s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop{ from{ transform:scale(0); } }
.rsvp-done .msg{ font-family:'Cormorant Garamond',serif; font-size:22px; color:#fff; line-height:1.5; }
.foot{ text-align:center; padding:40px 24px 60px; color:rgba(235,215,156,.5); font-size:12px; letter-spacing:.08em; }
.loading,.errbox{ text-align:center; padding:100px 24px; color:rgba(250,246,237,.7); position:relative; z-index:10; }
.errbox{ color:#e8b4b4; }
.spinner{ width:40px; height:40px; margin:0 auto 20px; border:2px solid rgba(235,215,156,.2);
  border-top-color:var(--gold-lt); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

@media (prefers-reduced-motion: reduce){
  .envelope,.glow,.pt,.seal,.scroll-cue .chev,.env-hint .tap{ animation:none !important; }
  .reveal{ transition:opacity .3s; transform:none; }
}
</style>
</head>
<body>

<!-- FUNDO -->
<div id="bg-scene">
  <div class="glow glow-1" data-depth="0.3"></div>
  <div class="glow glow-2" data-depth="0.5"></div>
  <div class="glow glow-3" data-depth="0.2"></div>
  <div class="particles" id="particles"></div>
</div>

<!-- ENVELOPE — cena de abertura em camadas -->
<div id="stage" data-state="closed">
  <div class="env-scene">
    <div class="envelope" id="envelope">
      <div class="env-shadow"></div>
      <div class="envelope-body">
        <div class="env-back"></div>
        <div class="env-inner"></div>
        <div class="card-slot" id="card-slot">
          <div class="card">
            <div class="card-monogram" id="card-mono">C · M</div>
            <div class="card-ornament"></div>
            <div class="card-title">Convite</div>
            <div class="card-couple"><span id="card-a">Caroline</span> <span class="card-amp">&</span> <span id="card-b">Marlon</span></div>
          </div>
        </div>
        <div class="env-front"></div>
        <div class="flap" id="flap">
          <div class="flap-back"></div>
          <div class="flap-face"></div>
        </div>
        <div class="seal" id="seal"><span class="seal-text" id="seal-text">CM</span></div>
      </div>
    </div>
    <div class="env-hint" id="env-hint">Toque para abrir<span class="arrow">↓</span></div>
  </div>
</div>

<!-- CONVITE -->
<div id="invite">
  <div class="loading" id="inv-loading"><div class="spinner"></div>Carregando convite…</div>
  <div class="errbox" id="inv-error" hidden></div>
  <div id="inv-body" hidden>
    <section class="hero">
      <div class="hero-inner" id="hero-inner">
        <div class="hero-badge" id="hero-badge"><span id="hero-mono">✦</span></div>
        <div class="eyebrow">Vamos nos casar</div>
        <h1 class="serif couple" id="hero-couple"></h1>
        <p class="tagline" id="hero-tagline"></p>
      </div>
      <div class="scroll-cue"><span>role para ver</span><span class="chev">⌄</span></div>
    </section>

    <section class="section reveal">
      <div class="glass-card">
        <div class="divider"><span class="line"></span><span class="dot">✦</span><span class="line r"></span></div>
        <div class="info-list" id="info-list"></div>
      </div>
    </section>

    <section class="section reveal" id="btn-sec" hidden>
      <div id="action-btns"></div>
    </section>

    <section class="section reveal rsvp">
      <div class="glass-card">
        <h2>Confirme sua presença</h2>
        <div class="fam" id="rsvp-fam"></div>
        <div class="names" id="rsvp-names"></div>
        <div id="rsvp-area">
          <div class="rsvp-btns">
            <button class="btn btn-gold" data-ans="sim">✓ Sim, estarei presente</button>
            <button class="btn btn-glass" data-ans="pensando">Ainda vou confirmar</button>
            <button class="btn btn-glass" data-ans="nao">Não poderei comparecer</button>
          </div>
        </div>
      </div>
    </section>

    <div class="foot">Feito com carinho ✦ EventFlow</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  const CFG={ apiKey:"AIzaSyAxbgXptautbR5Za8677fMolcWIRtr-D7c", authDomain:"wedding-dreams-71032.firebaseapp.com",
    projectId:"wedding-dreams-71032", storageBucket:"wedding-dreams-71032.firebasestorage.app",
    messagingSenderId:"789020951087", appId:"1:789020951087:web:faac7a215d284e472afcda" };
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDate=d=>{ if(!d) return ''; const p=String(d).split('-'); if(p.length!==3) return d;
    const m=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    return `${parseInt(p[2])} de ${m[parseInt(p[1])-1]} de ${p[0]}`; };
  const token=(location.hash||'').replace('#','').trim();

  // partículas
  (function makeParticles(){
    const box=document.getElementById('particles'); if(!box) return;
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; if(reduce) return;
    const n=window.innerWidth<600?14:26;
    for(let i=0;i<n;i++){ const p=document.createElement('div'); p.className='pt';
      p.style.left=Math.random()*100+'%'; p.style.animationDuration=(8+Math.random()*10)+'s';
      p.style.animationDelay=(Math.random()*10)+'s'; const s=2+Math.random()*3; p.style.width=p.style.height=s+'px';
      box.appendChild(p); }
  })();

  // parallax do fundo (mouse no desktop, giroscópio-lite via scroll no mobile)
  (function parallax(){
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; if(reduce) return;
    const glows=[...document.querySelectorAll('.glow')];
    if(!matchMedia('(pointer:coarse)').matches){
      window.addEventListener('mousemove',e=>{
        const x=(e.clientX/window.innerWidth-.5), y=(e.clientY/window.innerHeight-.5);
        glows.forEach(g=>{ const d=parseFloat(g.dataset.depth||'.3'); g.style.transform=`translate(${x*d*60}px,${y*d*60}px)`; });
      },{passive:true});
    }
    window.addEventListener('scroll',()=>{
      const y=window.scrollY;
      glows.forEach(g=>{ const d=parseFloat(g.dataset.depth||'.3'); g.style.transform=`translateY(${y*d*.3}px)`; });
    },{passive:true});
  })();

  try{ firebase.initializeApp(CFG); }catch(e){}
  const db=firebase.firestore(); let DATA=null;

  // ══ MÁQUINA DE ESTADOS DA ABERTURA ══
  // CLOSED → OPENING_SEAL → OPENING_FLAP → REVEALING_CARD → CARD_REVEALED → ENTERING → OPEN
  const stage=document.getElementById('stage'), envelope=document.getElementById('envelope');
  let isOpening=false;
  function setState(s){ stage.setAttribute('data-state', s); }

  function openSequence(){
    if(isOpening) return; isOpening=true;
    envelope.classList.add('locked');

    // 1) resposta física ao toque (0-150ms)
    envelope.classList.add('tap-pulse');
    setTimeout(()=>envelope.classList.remove('tap-pulse'), 200);

    // 2) selo reage (150-650ms)
    setTimeout(()=>{ setState('opening_seal'); }, 150);

    // 3) aba abre em perspectiva 3D (650-1500ms)
    setTimeout(()=>{ setState('opening_flap'); }, 650);

    // 4) pausa curta, depois cartão começa a subir (1500-2500ms)
    setTimeout(()=>{ setState('revealing_card'); }, 1500);

    // 5) cartão estabiliza (2500-2800ms)
    setTimeout(()=>{ setState('card_revealed'); }, 2500);

    // 6) pausa de revelação (400ms), depois transição final (2800-4000ms)
    setTimeout(()=>{ setState('entering'); }, 2900);

    // 7) troca para o convite (3900ms)
    setTimeout(()=>{
      stage.classList.add('gone');
      document.getElementById('invite').classList.add('show');
      initReveal();
      setState('open');
    }, 3900);
  }
  envelope.addEventListener('click', openSequence);


  const loading=document.getElementById('inv-loading'), errBox=document.getElementById('inv-error'), body=document.getElementById('inv-body');
  function fail(m){ loading.hidden=true; errBox.hidden=false; errBox.textContent=m; }
  if(!token){ fail('Convite inválido.'); document.querySelector('.env-hint').textContent='Convite inválido'; }
  else db.collection('shares').doc(token).get().then(snap=>{
    if(!snap.exists){ fail('Convite não encontrado ou removido.'); return; }
    DATA=snap.data(); if(DATA.active===false){ fail('Este convite não está mais ativo.'); return; }
    fillEnvelope(); render(DATA);
  }).catch(e=>{ fail('Não foi possível carregar o convite.'); console.error(e); });

  function initials(d){ return ((d.coupleA?.[0]||'')+(d.coupleB?.[0]||''))||'✦'; }
  function fillEnvelope(){ const a=DATA.coupleA||'', b=DATA.coupleB||'';
    const initials = ((a[0]||'')+(b[0]||''))||'✦';
    const sealEl=document.getElementById('seal-text'); if(sealEl) sealEl.textContent = initials.toUpperCase();
    const monoEl=document.getElementById('card-mono'); if(monoEl) monoEl.textContent = a && b ? (a[0].toUpperCase()+' · '+b[0].toUpperCase()) : initials.toUpperCase();
    const cA=document.getElementById('card-a'); const cB=document.getElementById('card-b');
    if(cA && a) cA.textContent = a;
    if(cB && b) cB.textContent = b;
  }

  function render(d){
    loading.hidden=true; body.hidden=false;
    const hb=document.getElementById('hero-badge');
    if(d.photoUrl){ hb.innerHTML=`<img src="${esc(d.photoUrl)}" alt="" onerror="this.parentElement.innerHTML='<span>'+${JSON.stringify(initials(d))}+'</span>'">`; }
    else document.getElementById('hero-mono').textContent=initials(d);
    document.getElementById('hero-couple').innerHTML = (d.coupleA||d.coupleB)
      ? `${esc(d.coupleA)}<span class="amp">&</span>${esc(d.coupleB)}` : esc(d.event||'Nosso Casamento');
    document.getElementById('hero-tagline').textContent = d.message || 'Com imensa alegria, convidamos você para celebrar o nosso amor.';

    const list=document.getElementById('info-list'); let rows='';
    const row=(ico,label,val)=>`<div class="info-row"><div class="ir-ico">${ico}</div><div><div class="ir-label">${label}</div><div class="ir-value">${val}</div></div></div>`;
    if(d.date) rows+=row('📅','Data',fmtDate(d.date));
    if(d.time) rows+=row('🕐','Horário',esc(d.time));
    if(d.place) rows+=row('📍','Local',esc(d.place));
    if(d.dresscode) rows+=row('👔','Traje',esc(d.dresscode));
    list.innerHTML=rows;

    let btns='';
    if(d.mapUrl) btns+=`<a class="btn btn-glass" href="${esc(d.mapUrl)}" target="_blank" rel="noopener">📍 Ver localização</a>`;
    if(d.giftUrl) btns+=`<a class="btn btn-gold" href="${esc(d.giftUrl)}" target="_blank" rel="noopener">🎁 Lista de presentes</a>`;
    if(btns){ document.getElementById('action-btns').innerHTML=btns; document.getElementById('btn-sec').hidden=false; }

    document.getElementById('rsvp-fam').textContent = d.familyName? 'Convite para '+d.familyName : '';
    document.getElementById('rsvp-names').textContent = (d.guestNames||[]).join(' · ');
    db.collection('rsvp').doc(token).get().then(s=>{ if(s.exists && s.data().answer) showAnswered(s.data().answer); }).catch(()=>{});
    document.querySelectorAll('[data-ans]').forEach(b=>b.addEventListener('click',()=>sendRSVP(b.dataset.ans)));
    setTimeout(initReveal,100);
  }

  function sendRSVP(ans){
    const area=document.getElementById('rsvp-area');
    area.innerHTML='<div style="text-align:center;color:rgba(235,215,156,.8)"><div class="spinner"></div>Enviando…</div>';
    db.collection('rsvp').doc(token).set({ token, answer:ans, answeredAt:Date.now(),
      names:(DATA.guestNames||[]), count:(DATA.guestNames||[]).length, note:'' })
      .then(()=>showAnswered(ans))
      .catch(e=>{ area.innerHTML='<div style="text-align:center;color:#e8b4b4">Não foi possível enviar. Tente novamente.</div>'; console.error(e); });
  }
  function showAnswered(ans){
    const area=document.getElementById('rsvp-area');
    const map={ sim:{e:'🎉',m:'Que alegria! Sua presença está confirmada.'},
      pensando:{e:'💭',m:'Tudo bem! Aguardamos sua confirmação em breve.'},
      nao:{e:'💛',m:'Sentiremos sua falta, mas agradecemos o carinho.'} };
    const r=map[ans]||map.pensando;
    area.innerHTML=`<div class="rsvp-done"><div class="big">${r.e}</div><div class="msg">${r.m}</div>
      <div style="margin-top:22px"><button class="btn btn-glass" onclick="location.reload()" style="max-width:220px;margin:0 auto">Alterar resposta</button></div></div>`;
  }
  function initReveal(){
    if(!('IntersectionObserver' in window)){ document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in')); return; }
    const io=new IntersectionObserver((ents)=>ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.12});
    document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
  }
})();
</script>
</body>
</html>
