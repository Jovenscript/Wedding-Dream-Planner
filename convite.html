<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=3" />
<title>Convite de Casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --olive:#6B7B4A; --olive-dark:#4A5631; --gold:#C9A84C; --gold-lt:#F0DCA0; --ivory:#FAF8F3; --ivory-card:#FFFDF8; --ink:#3A3A2E; --ink-soft:#7A7A66; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{ font-family:'Inter',sans-serif; color:var(--ink); background:var(--ivory);
  -webkit-font-smoothing:antialiased; overflow-x:hidden; }
.serif{ font-family:'Cormorant Garamond',serif; }

/* ═══ CENA DO ENVELOPE ═══ */
#stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(120% 120% at 50% 20%, #f4efe4 0%, #e8e0cf 55%, #dcd2bd 100%); z-index:100;
  transition:opacity .8s ease, visibility .8s; padding:24px; }
#stage.gone{ opacity:0; visibility:hidden; }
.env-wrap{ text-align:center; }
.env-hint{ font-size:13px; color:var(--ink-soft); letter-spacing:.05em; margin-top:26px; opacity:0; animation:hintIn 1s ease .8s forwards; }
@keyframes hintIn{ to{ opacity:1; } }
.env-hint .tap{ display:inline-block; animation:pulse 1.8s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }

/* envelope */
.envelope{ position:relative; width:min(340px,82vw); height:min(232px,56vw); cursor:pointer;
  filter:drop-shadow(0 20px 40px rgba(74,86,51,.28)); transition:transform .4s ease;
  animation:envIn 1s cubic-bezier(.2,.8,.2,1); }
.envelope:active{ transform:scale(.98); }
@keyframes envIn{ from{ opacity:0; transform:translateY(30px) scale(.9);} to{ opacity:1; transform:none; } }
.env-body{ position:absolute; inset:0; background:linear-gradient(160deg,#fbf7ee,#f0e8d6);
  border-radius:10px; border:1px solid rgba(201,168,76,.35); overflow:hidden; }
/* triângulos laterais/base do envelope */
.env-body::before{ content:''; position:absolute; inset:0;
  background:
    linear-gradient(135deg, transparent 49.6%, rgba(0,0,0,.05) 50%) left/50% 100% no-repeat,
    linear-gradient(-135deg, transparent 49.6%, rgba(0,0,0,.05) 50%) right/50% 100% no-repeat; }
/* a carta que sobe */
.letter{ position:absolute; left:8%; right:8%; top:14%; bottom:8%; background:var(--ivory-card);
  border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,.08); z-index:1;
  transform:translateY(0); transition:transform 1s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:16px; }
.letter .l-couple{ font-size:26px; color:var(--olive-dark); }
.letter .l-amp{ color:var(--gold); font-style:italic; }
.letter .l-sub{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft); margin-top:6px; }
/* aba superior (flap) que abre */
.flap{ position:absolute; left:0; right:0; top:0; height:56%; z-index:3; transform-origin:top center;
  transition:transform 1s cubic-bezier(.6,0,.3,1); backface-visibility:hidden; }
.flap svg{ display:block; width:100%; height:100%; }
.env-front{ position:absolute; left:0; right:0; bottom:0; height:62%; z-index:4;
  background:linear-gradient(160deg,#f2ead8,#e8dfc9); clip-path:polygon(0 100%,0 22%,50% 100%,100% 22%,100% 100%);
  border-radius:0 0 10px 10px; }
/* selo/lacre */
.seal{ position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); z-index:5;
  width:66px; height:66px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #d9b95a, var(--gold) 55%, #a9832f);
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(169,131,47,.5), inset 0 2px 4px rgba(255,255,255,.4);
  transition:transform .5s ease, opacity .5s ease; }
.seal .serif{ color:#fff9e8; font-size:30px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.2); }

/* estado ABERTO */
.envelope.open .flap{ transform:rotateX(180deg); z-index:1; }
.envelope.open .seal{ transform:translate(-50%,-50%) scale(.4); opacity:0; }
.envelope.open .letter{ transform:translateY(-64%); z-index:6; box-shadow:0 18px 40px rgba(0,0,0,.2); }

/* ═══ CONVITE (conteúdo) ═══ */
#invite{ opacity:0; transition:opacity .8s ease .2s; }
#invite.show{ opacity:1; }
.hero{ min-height:92vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:48px 24px; position:relative;
  background:radial-gradient(120% 90% at 50% 0%, #f4efe4, var(--ivory)); }
.hero-photo{ width:min(220px,60vw); height:min(220px,60vw); border-radius:50%; object-fit:cover;
  border:4px solid var(--ivory-card); box-shadow:0 12px 30px rgba(74,86,51,.25); margin-bottom:26px; }
.hero-mono{ width:78px; height:78px; border-radius:50%; border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center; margin-bottom:26px; color:var(--gold); font-size:34px; }
.hero .eyebrow{ font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--olive); margin-bottom:14px; }
.hero .couple{ font-size:clamp(38px,12vw,64px); line-height:1.05; color:var(--olive-dark); }
.hero .amp{ color:var(--gold); font-style:italic; display:block; font-size:.6em; margin:4px 0; }
.hero .tagline{ font-size:16px; color:var(--ink-soft); margin-top:20px; max-width:30ch; font-style:italic; }
.scroll-cue{ position:absolute; bottom:24px; left:50%; transform:translateX(-50%); color:var(--olive); font-size:22px; animation:pulse 1.8s ease-in-out infinite; }

.reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.3,1); }
.reveal.in{ opacity:1; transform:none; }

.section{ padding:44px 24px; max-width:560px; margin:0 auto; }
.divider{ width:60px; height:1px; background:var(--gold); margin:0 auto 30px; position:relative; }
.divider::before{ content:'✦'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--ivory); padding:0 10px; color:var(--gold); font-size:13px; }
.info-grid{ display:grid; gap:16px; }
.info-card{ background:var(--ivory-card); border:1px solid rgba(201,168,76,.25); border-radius:16px;
  padding:20px; text-align:center; box-shadow:0 4px 16px rgba(74,86,51,.06); }
.info-card .ic-ico{ font-size:26px; margin-bottom:8px; }
.info-card .ic-label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
.info-card .ic-value{ font-size:21px; color:var(--olive-dark); margin-top:4px; }
.info-card.serif .ic-value{ font-family:'Cormorant Garamond',serif; font-size:26px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:16px 20px; border-radius:14px; font-size:16px; font-weight:600; border:none; cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease; text-decoration:none; margin-top:12px; }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--olive); color:#fff; box-shadow:0 8px 22px rgba(74,86,51,.3); }
.btn-gold{ background:var(--gold); color:#40320c; box-shadow:0 8px 22px rgba(201,168,76,.35); }
.btn-ghost{ background:transparent; border:1.5px solid var(--olive); color:var(--olive-dark); }

/* RSVP */
.rsvp{ background:linear-gradient(160deg,#f2ead8,#f7f2e6); }
.rsvp h2{ font-size:30px; color:var(--olive-dark); text-align:center; margin-bottom:6px; }
.rsvp .fam{ text-align:center; color:var(--ink-soft); font-size:15px; margin-bottom:6px; }
.rsvp .names{ text-align:center; color:var(--olive); font-size:14px; margin-bottom:24px; }
.rsvp-btns{ display:grid; gap:12px; }
.rsvp-done{ text-align:center; padding:30px 16px; }
.rsvp-done .big{ font-size:48px; margin-bottom:12px; }
.rsvp-done .msg{ font-size:18px; color:var(--olive-dark); }
.foot{ text-align:center; padding:30px 24px 50px; color:var(--ink-soft); font-size:12px; }
.loading,.errbox{ text-align:center; padding:80px 24px; color:var(--ink-soft); }
</style>
</head>
<body>

<!-- ENVELOPE -->
<div id="stage">
  <div class="env-wrap">
    <div class="envelope" id="envelope">
      <div class="env-body">
        <div class="letter" id="letter">
          <div class="serif l-couple" id="l-couple">— & —</div>
          <div class="l-sub">nosso convite</div>
        </div>
      </div>
      <div class="env-front"></div>
      <div class="flap" id="flap">
        <svg viewBox="0 0 340 130" preserveAspectRatio="none"><polygon points="0,0 340,0 170,120" fill="#e8dfc9"/><polygon points="0,0 340,0 170,120" fill="none" stroke="rgba(201,168,76,.4)" stroke-width="1"/></svg>
      </div>
      <div class="seal" id="seal"><span class="serif" id="seal-letter">✦</span></div>
    </div>
    <div class="env-hint">toque no <span class="tap">✦</span> para abrir</div>
  </div>
</div>

<!-- CONVITE -->
<div id="invite">
  <div class="loading" id="inv-loading">Carregando convite…</div>
  <div class="errbox" id="inv-error" hidden></div>
  <div id="inv-body" hidden>
    <section class="hero">
      <div id="hero-visual"></div>
      <div class="eyebrow" id="hero-eyebrow">Vamos nos casar</div>
      <h1 class="serif couple" id="hero-couple"></h1>
      <p class="tagline serif" id="hero-tagline"></p>
      <div class="scroll-cue">⌄</div>
    </section>

    <section class="section">
      <div class="divider"></div>
      <div class="info-grid" id="info-grid"></div>
    </section>

    <section class="section rsvp reveal" id="rsvp-sec">
      <h2 class="serif">Confirme sua presença</h2>
      <div class="fam" id="rsvp-fam"></div>
      <div class="names" id="rsvp-names"></div>
      <div id="rsvp-area">
        <div class="rsvp-btns">
          <button class="btn btn-primary" data-ans="sim">✓ Sim, estarei presente!</button>
          <button class="btn btn-ghost" data-ans="pensando">Ainda vou confirmar</button>
          <button class="btn btn-ghost" data-ans="nao">Infelizmente não poderei ir</button>
        </div>
      </div>
    </section>

    <div class="foot">Feito com carinho ✦ EventFlow</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  const CFG={ apiKey:"AIzaSyAxbgXptautbR5Za8677fMolcWIRtr-D7c", authDomain:"wedding-dreams-71032.firebaseapp.com",
    projectId:"wedding-dreams-71032", storageBucket:"wedding-dreams-71032.firebasestorage.app",
    messagingSenderId:"789020951087", appId:"1:789020951087:web:faac7a215d284e472afcda" };
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDate=d=>{ if(!d) return ''; const p=String(d).split('-'); if(p.length!==3) return d;
    const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    return `${parseInt(p[2])} de ${meses[parseInt(p[1])-1]} de ${p[0]}`; };
  const token=(location.hash||'').replace('#','').trim();
  try{ firebase.initializeApp(CFG); }catch(e){}
  const db=firebase.firestore();
  let DATA=null;

  // ── ENVELOPE ──
  const stage=document.getElementById('stage'), envelope=document.getElementById('envelope');
  let opened=false;
  envelope.addEventListener('click', ()=>{
    if(opened) return; opened=true;
    envelope.classList.add('open');
    setTimeout(()=>{ stage.classList.add('gone'); document.getElementById('invite').classList.add('show');
      initReveal(); }, 1200);
  });

  // ── carrega dados ──
  const loading=document.getElementById('inv-loading'), errBox=document.getElementById('inv-error'), body=document.getElementById('inv-body');
  function fail(m){ loading.hidden=true; errBox.hidden=false; errBox.textContent=m; }
  if(!token){ fail('Convite inválido.'); document.querySelector('.env-hint').textContent='Convite inválido'; }
  else db.collection('shares').doc(token).get().then(snap=>{
    if(!snap.exists){ fail('Convite não encontrado ou removido.'); return; }
    DATA=snap.data();
    if(DATA.active===false){ fail('Este convite não está mais ativo.'); return; }
    fillLetter(); render(DATA);
  }).catch(e=>{ fail('Não foi possível carregar o convite.'); console.error(e); });

  function fillLetter(){
    const a=DATA.coupleA||'', b=DATA.coupleB||'';
    document.getElementById('l-couple').innerHTML = (a||b)? `${esc(a)} <span class="l-amp">&</span> ${esc(b)}` : esc(DATA.event||'Convite');
    document.getElementById('seal-letter').textContent = (a||b) ? (a[0]||'')+(b[0]||'') : '✦';
  }

  function render(d){
    loading.hidden=true; body.hidden=false;
    // hero visual: foto ou monograma
    const hv=document.getElementById('hero-visual');
    if(d.photoUrl){ hv.innerHTML=`<img class="hero-photo" src="${esc(d.photoUrl)}" alt="" onerror="this.remove()">`; }
    else { hv.innerHTML=`<div class="hero-mono serif">${esc((d.coupleA?.[0]||'')+(d.coupleB?.[0]||'')||'✦')}</div>`; }
    document.getElementById('hero-couple').innerHTML = (d.coupleA||d.coupleB)
      ? `${esc(d.coupleA)}<span class="amp serif">&</span>${esc(d.coupleB)}` : esc(d.event||'Nosso Casamento');
    document.getElementById('hero-tagline').textContent = d.message || 'Convidamos você para celebrar o nosso amor.';

    // cards de informação
    const grid=document.getElementById('info-grid'); let cards='';
    if(d.date) cards+=infoCard('📅','Data',fmtDate(d.date),true);
    if(d.time) cards+=infoCard('🕐','Horário',esc(d.time),true);
    if(d.place) cards+=infoCard('📍','Local',esc(d.place),false);
    if(d.dresscode) cards+=infoCard('👔','Traje',esc(d.dresscode),false);
    grid.innerHTML=cards;
    // botões de ação
    let btns='';
    if(d.mapUrl) btns+=`<a class="btn btn-ghost" href="${esc(d.mapUrl)}" target="_blank" rel="noopener">📍 Ver localização</a>`;
    if(d.giftUrl) btns+=`<a class="btn btn-gold" href="${esc(d.giftUrl)}" target="_blank" rel="noopener">🎁 Lista de presentes</a>`;
    if(btns){ const wrap=document.createElement('div'); wrap.className='section reveal'; wrap.style.paddingTop='0'; wrap.innerHTML=btns; document.getElementById('rsvp-sec').before(wrap); }

    // RSVP
    document.getElementById('rsvp-fam').textContent = d.familyName? 'Convite para '+d.familyName : '';
    document.getElementById('rsvp-names').textContent = (d.guestNames||[]).join(' · ');
    // já respondeu antes?
    db.collection('rsvp').doc(token).get().then(s=>{ if(s.exists && s.data().answer) showAnswered(s.data().answer); }).catch(()=>{});

    document.querySelectorAll('[data-ans]').forEach(b=>b.addEventListener('click',()=>sendRSVP(b.dataset.ans)));
    setTimeout(initReveal, 100);
  }
  function infoCard(ico,label,val,serif){ return `<div class="info-card reveal ${serif?'serif':''}"><div class="ic-ico">${ico}</div><div class="ic-label">${label}</div><div class="ic-value">${val}</div></div>`; }

  function sendRSVP(ans){
    const area=document.getElementById('rsvp-area');
    area.innerHTML='<div style="text-align:center;color:var(--ink-soft)">Enviando…</div>';
    db.collection('rsvp').doc(token).set({ token, answer:ans, answeredAt:Date.now(),
      names:(DATA.guestNames||[]), count:(DATA.guestNames||[]).length, note:'' })
      .then(()=>showAnswered(ans))
      .catch(e=>{ area.innerHTML='<div style="text-align:center;color:#b23">Não foi possível enviar. Tente de novo.</div>'; console.error(e); });
  }
  function showAnswered(ans){
    const area=document.getElementById('rsvp-area');
    const map={ sim:{e:'🎉',m:'Que alegria! Sua presença está confirmada.'},
      pensando:{e:'💭',m:'Tudo bem! Aguardamos sua confirmação em breve.'},
      nao:{e:'💛',m:'Sentiremos sua falta, mas agradecemos o carinho.'} };
    const r=map[ans]||map.pensando;
    area.innerHTML=`<div class="rsvp-done"><div class="big">${r.e}</div><div class="msg serif">${r.m}</div>
      <div style="margin-top:18px"><button class="btn btn-ghost" onclick="location.reload()" style="max-width:220px;margin:0 auto">Alterar resposta</button></div></div>`;
  }

  // scroll reveal
  function initReveal(){
    if(!('IntersectionObserver' in window)){ document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in')); return; }
    const io=new IntersectionObserver((ents)=>ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.12});
    document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
  }
})();
</script>
</body>
</html>
